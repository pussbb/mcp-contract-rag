# contract-rag configuration. Every string value supports ${ENV_VAR} and ${ENV_VAR:-default}.
# Location: ./contract-rag.yaml, or the path in CONTRACT_RAG_CONFIG. Every key is optional.

database:
  url: ${DATABASE_URL:-postgres://postgres:postgres@localhost:5432/contract_rag}
  schema: contract_rag        # PostgreSQL schema that holds the tables (created if missing)
  poolSize: 4

triage:                       # Tier 2: local LLM picks the best contracts (LM Studio, OpenAI-compatible)
  enabled: ${TRIAGE_ENABLED:-true}
  url: ${LM_STUDIO_URL:-http://localhost:1234/v1}
  model: ${LM_STUDIO_MODEL:-local-model}
  timeoutMs: 8000
  keep: 3                     # contracts kept after triage

search:
  tier1Limit: 12              # rows fetched from PostgreSQL before triage
  resourceLimit: 50           # rows in codebase://exports/high-priority
  maxRows: 500                # SQL LIMIT for list-style tools (list_file_exports, find_symbol, ...)
  streamBatchSize: 100        # rows per round trip when streaming from PostgreSQL
  graphLimit: 5000            # SQL LIMIT for the codebase://graph/dependencies resources

hooks:                        # behavior of the Claude Code hooks installed by `contract-rag install-hooks`
  context:                    # UserPromptSubmit: inject matching contracts into the prompt
    enabled: true
    limit: 5
    minRelevance: 3           # 3 = a word of the prompt appears in an entity name
    minPromptChars: 12
    maxChars: 1500

usage:                        # PostToolUse hook: record which contract-rag tools get called (`yarn usage`)
  enabled: true
  storeInput: true            # also keep tool arguments (may contain search text)

sync:
  mtimePrecheck: true         # skip reading files whose size and mtime are unchanged

ranking:                      # priority_score = folder weight + inboundEdgeWeight per importer (capped)
  inboundEdgeWeight: 2
  inboundEdgeCap: 40
  folderWeights:              # first matching case-insensitive path fragment wins
    - { match: /utils/, weight: 50 }
    - { match: /helpers/, weight: 50 }
    - { match: /extensions/, weight: 40 }
    - { match: /hooks/, weight: 40 }
    - { match: /shared/, weight: 30 }
    - { match: /lib/, weight: 30 }
    - { match: /services/, weight: 25 }
    - { match: /components/, weight: 20 }

ignore:
  dirs: [node_modules, fixtures, __pycache__, .venv, venv, site-packages, bin, obj, out, .git, dist, build, coverage, .next, .turbo, .idea, .claude]
  files:                      # regular expressions matched against the file name
    - '\.(d\.ts|test\.[tj]sx?|spec\.[tj]sx?|stories\.[tj]sx?)$'
    - '^(test_.*|conftest)\.py$'
    - '_test\.py$'
    - '\.(g|generated|Designer)\.cs$'
    - '^(AssemblyInfo|GlobalUsings)\.cs$'

languages:                    # language is chosen per file by extension
  typescript:
    extensions: [.ts, .tsx, .js, .jsx, .mjs]
  python:
    extensions: [.py]
    command: python3
  csharp:
    extensions: [.cs]
    command: dotnet
    autoBuild: true           # build the Roslyn extractor on first use (yarn build:dotnet does it ahead of time)

services:                     # codebases to index; roots are relative to this file
  - name: contract-rag
    root: .
  - name: py-fixture
    root: test/fixtures/py-service
  - name: cs-fixture
    root: test/fixtures/cs-service
